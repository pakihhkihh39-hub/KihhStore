<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kihh Game - Coin Catcher</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #071426;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #60a5fa;
    text-shadow: 0 0 15px #2563eb;
}

.info {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px auto;
}

.box {
    background: #172b46;
    border-radius: 12px;
    padding: 12px 25px;
    min-width: 120px;
}

.box span {
    color: #facc15;
    font-size: 25px;
    font-weight: bold;
}

#arena {
    position: relative;
    width: 100%;
    max-width: 500px;
    height: 400px;
    margin: auto;
    overflow: hidden;
    border: 2px solid #3b82f6;
    border-radius: 15px;
    background:
        radial-gradient(circle at 50% 20%, #16345c, #071426 75%);
}

#arena::before {
    content: "⭐       ✦        ⭐";
    position: absolute;
    top: 25px;
    left: 0;
    width: 100%;
    color: #93c5fd;
    opacity: .6;
}

#pemain {
    position: absolute;
    bottom: 12px;
    left: 42%;
    font-size: 42px;
    width: 50px;
    text-align: center;
    user-select: none;
}

.koin {
    position: absolute;
    font-size: 28px;
    user-select: none;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 13px 22px;
    margin: 8px 4px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.96);
}

button:hover {
    background: #1d4ed8;
}

#pesan {
    color: #facc15;
    min-height: 24px;
}

.petunjuk {
    color: #94a3b8;
    font-size: 14px;
}

</style>
</head>

<body>

<h1>🎮 Kihh Game</h1>
<p>Tangkap koin dan kumpulkan skor!</p>

<div class="info">
    <div class="box">
        SKOR<br>
        <span id="skor">0</span>
    </div>

    <div class="box">
        WAKTU<br>
        <span id="waktu">30</span>
    </div>
</div>

<div id="arena">
    <div id="pemain">🧺</div>
</div>

<p id="pesan">Tekan MULAI untuk bermain!</p>

<button onclick="mulai()">▶ MULAI / ULANG</button>
<br>

<button onclick="gerak(-1)">⬅ KIRI</button>
<button onclick="gerak(1)">KANAN ➡</button>

<p class="petunjuk">
    Komputer: gunakan tombol panah kiri dan kanan.<br>
    HP: gunakan tombol kiri dan kanan di bawah arena.
</p>

<script>
const arena = document.getElementById("arena");
const pemain = document.getElementById("pemain");
const skorTeks = document.getElementById("skor");
const waktuTeks = document.getElementById("waktu");
const pesan = document.getElementById("pesan");

let skor = 0;
let waktu = 30;
let posisi = 0;
let aktif = false;
let koin = [];
let timer;
let animasi;
let terakhir = 0;
let terakhirBuat = 0;

function gerak(arah) {
    if (!aktif) return;

    posisi += arah * 25;
    posisi = Math.max(
        0,
        Math.min(arena.clientWidth - 50, posisi)
    );

    pemain.style.left = posisi + "px";
}

document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowLeft") gerak(-1);
    if (e.key === "ArrowRight") gerak(1);
});

function buatKoin() {
    const elemen = document.createElement("div");
    elemen.className = "koin";
    elemen.textContent = "🪙";

    const x = Math.random() *
        (arena.clientWidth - 30);

    elemen.style.left = x + "px";
    elemen.style.top = "-35px";

    arena.appendChild(elemen);

    koin.push({
        elemen: elemen,
        x: x,
        y: -35
    });
}

function selesai() {
    aktif = false;
    clearInterval(timer);
    cancelAnimationFrame(animasi);

    pesan.textContent =
        "Waktu habis! Skor akhir kamu: " + skor;

    koin.forEach(k => k.elemen.remove());
    koin = [];
}

function langkah(sekarang) {
    if (!aktif) return;

    if (!terakhir) terakhir = sekarang;

    const delta = Math.min(
        (sekarang - terakhir) / 16.67, 2
    );

    terakhir = sekarang;

    if (sekarang - terakhirBuat > 650) {
        buatKoin();
        terakhirBuat = sekarang;
    }

    const tinggiPemain = arena.clientHeight - 65;
    const kiriPemain = posisi;
    const kananPemain = posisi + 50;

    for (let i = koin.length - 1; i >= 0; i--) {
        const k = koin[i];

        k.y += 3 * delta;
        k.elemen.style.top = k.y + "px";

        const kena =
            k.y + 28 >= tinggiPemain &&
            k.y <= tinggiPemain + 45 &&
            k.x + 28 >= kiriPemain &&
            k.x <= kananPemain;

        if (kena) {
            skor += 10;
            skorTeks.textContent = skor;
            k.elemen.remove();
            koin.splice(i, 1);
        } else if (k.y > arena.clientHeight) {
            k.elemen.remove();
            koin.splice(i, 1);
        }
    }

    animasi = requestAnimationFrame(langkah);
}

function mulai() {
    clearInterval(timer);
    cancelAnimationFrame(animasi);

    koin.forEach(k => k.elemen.remove());
    koin = [];

    skor = 0;
    waktu = 30;
    posisi = (arena.clientWidth - 50) / 2;
    terakhir = 0;
    terakhirBuat = 0;
    aktif = true;

    skorTeks.textContent = skor;
    waktuTeks.textContent = waktu;
    pesan.textContent = "Ayo tangkap semua koin!";

    pemain.style.left = posisi + "px";

    timer = setInterval(function() {
        waktu--;
        waktuTeks.textContent = waktu;

        if (waktu <= 0) selesai();
    }, 1000);

    animasi = requestAnimationFrame(langkah);
}
</script>

</body>
</html>
